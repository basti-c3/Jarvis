[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.0.1"
description = "Voice assistant incl. STT, TTS with Jarvis' voice"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "vosk",
    "sounddevice",
    "pyyaml",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
